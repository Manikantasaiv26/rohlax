<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="ROHLAX  Staffing · Development · Consulting">
  <rect width="720" height="200" fill="#F6F4EF"/>

  <!-- Emblem -->
  <g transform="translate(20,10)">
    <circle cx="90" cy="90" r="88" fill="#F6F4EF"/>

    <!-- LEFT gear: 3 teeth -->
    <g clip-path="url(#leftHalf)">
      <circle cx="90" cy="90" r="48" fill="#0A1E38"/>
      <circle cx="90" cy="90" r="28" fill="#F6F4EF"/>
      <g fill="#0A1E38">
        <g transform="rotate(-55 90 90)"><rect x="77" y="24" width="26" height="16" rx="2"/></g>
        <rect x="24" y="77" width="16" height="26" rx="2"/>
        <g transform="rotate(55 90 90)"><rect x="77" y="140" width="26" height="16" rx="2"/></g>
      </g>
    </g>

    <!-- RIGHT: 2 arcs -->
    <path d="M101 36 A56 56 0 0 1 101 144" stroke="#3B82F6" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M106 52 A38 38 0 0 1 106 128" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="101" cy="36" r="6.5" fill="#3B82F6"/>
    <circle cx="101" cy="144" r="6.5" fill="#3B82F6"/>
    <circle cx="146" cy="90" r="6.5" fill="#3B82F6"/>

    <!-- Center + crosshair -->
    <circle cx="90" cy="90" r="7" fill="#0A1E38"/>
    <path d="M90 52v30M90 98v30M52 90h30M98 90h30" stroke="#0A1E38" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="230" y="95" fill="#0A1E38" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="4">ROHLAX</text>
  <!-- Tagline -->
  <text x="230" y="132" fill="#3B82F6" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3.2">STAFFING " DEVELOPMENT " CONSULTING</text>

  <defs>
    <clipPath id="leftHalf"><rect x="0" y="0" width="90" height="180"/></clipPath>
  </defs>
</svg>
