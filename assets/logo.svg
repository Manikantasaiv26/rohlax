<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="ROHLAX logo">
  <!-- Soft cream circular badge -->
  <circle cx="60" cy="60" r="58" fill="#F5F2EC"/>
  <circle cx="60" cy="60" r="52" fill="#FAF8F4"/>

  <!-- LEFT: dark navy gear half -->
  <g clip-path="url(#clipLeft)">
    <!-- Gear body ring -->
    <circle cx="60" cy="60" r="34" fill="#0B1F3A"/>
    <circle cx="60" cy="60" r="22" fill="#FAF8F4"/>
    <!-- Teeth around left half -->
    <rect x="52" y="18" width="16" height="14" rx="2" fill="#0B1F3A"/>
    <rect x="52" y="88" width="16" height="14" rx="2" fill="#0B1F3A"/>
    <rect x="18" y="52" width="14" height="16" rx="2" fill="#0B1F3A"/>
    <g transform="rotate(-45 60 60)">
      <rect x="52" y="18" width="16" height="14" rx="2" fill="#0B1F3A"/>
      <rect x="52" y="88" width="16" height="14" rx="2" fill="#0B1F3A"/>
    </g>
    <g transform="rotate(45 60 60)">
      <rect x="52" y="18" width="16" height="14" rx="2" fill="#0B1F3A"/>
      <rect x="52" y="88" width="16" height="14" rx="2" fill="#0B1F3A"/>
    </g>
  </g>

  <!-- RIGHT: bright blue arcs + nodes -->
  <path d="M70 29.5a34.5 34.5 0 0 1 0 61" stroke="#3B82F6" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M80 41a23 23 0 0 1 0 38" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M82 34a36 36 0 0 1 14 26" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M96 60a36 36 0 0 1-14 26" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Nodes: top, middle-right, bottom -->
  <circle cx="70" cy="29.5" r="5.2" fill="#3B82F6"/>
  <circle cx="96" cy="60" r="5.2" fill="#3B82F6"/>
  <circle cx="70" cy="90.5" r="5.2" fill="#3B82F6"/>

  <!-- CENTER crosshair -->
  <circle cx="60" cy="60" r="6" fill="#0B1F3A"/>
  <!-- up / down / left / right -->
  <path d="M60 32v22" stroke="#0B1F3A" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M60 66v22" stroke="#0B1F3A" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M38 60h16" stroke="#0B1F3A" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M66 60h30" stroke="#0B1F3A" stroke-width="2.6" stroke-linecap="round"/>

  <defs>
    <clipPath id="clipLeft">
      <rect x="0" y="0" width="60" height="120"/>
    </clipPath>
  </defs>
</svg>
