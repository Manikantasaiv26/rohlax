<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="ROHLAX logo">
  <circle cx="100" cy="100" r="92" fill="#F6F4EF"/>

  <!-- LEFT gear half  5 teeth -->
  <g clip-path="url(#L)">
    <circle cx="100" cy="100" r="50" fill="#0A1E38"/>
    <circle cx="100" cy="100" r="28" fill="#F6F4EF"/>
    <g fill="#0A1E38">
      <!-- tooth 1 top -->
      <rect x="89" y="36" width="22" height="13" rx="1.5"/>
      <!-- tooth 2 -->
      <g transform="rotate(-36 100 100)"><rect x="89" y="36" width="22" height="13" rx="1.5"/></g>
      <!-- tooth 3 mid-left -->
      <rect x="36" y="89" width="13" height="22" rx="1.5"/>
      <!-- tooth 4 -->
      <g transform="rotate(36 100 100)"><rect x="89" y="151" width="22" height="13" rx="1.5"/></g>
      <!-- tooth 5 bottom -->
      <rect x="89" y="151" width="22" height="13" rx="1.5"/>
    </g>
  </g>

  <!-- RIGHT three arcs -->
  <path d="M115 48 A55 55 0 0 1 115 152" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
  <path d="M128 62 A40 40 0 0 1 128 138" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/>
  <path d="M139 76 A26 26 0 0 1 139 124" stroke="#3B82F6" stroke-width="6.5" stroke-linecap="round"/>

  <!-- nodes ends + mid -->
  <circle cx="115" cy="48" r="6" fill="#3B82F6"/>
  <circle cx="115" cy="152" r="6" fill="#3B82F6"/>
  <circle cx="155" cy="100" r="6" fill="#3B82F6"/>
  <circle cx="128" cy="62" r="5" fill="#3B82F6"/>
  <circle cx="128" cy="138" r="5" fill="#3B82F6"/>
  <circle cx="139" cy="76" r="4.5" fill="#3B82F6"/>
  <circle cx="139" cy="124" r="4.5" fill="#3B82F6"/>

  <path d="M142 58 A48 48 0 0 1 155 100" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/>
  <path d="M155 100 A48 48 0 0 1 142 142" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/>

  <!-- center + crosshair -->
  <circle cx="100" cy="100" r="7.5" fill="#0A1E38"/>
  <path d="M100 55v32M100 113v32M65 100h27M108 100h40" stroke="#0A1E38" stroke-width="2.8" stroke-linecap="round"/>

  <defs>
    <clipPath id="L"><rect width="100" height="200"/></clipPath>
  </defs>
</svg>
